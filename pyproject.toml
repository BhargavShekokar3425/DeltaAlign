[project]
name = "deltaalign"
version = "0.1.0"
description = "Reproducible locality experiments for incremental network alignment"
requires-python = ">=3.10"
dependencies = ["numpy==2.2.6", "scipy==1.15.3", "networkx==3.4.2"]

[project.optional-dependencies]
plots = ["matplotlib==3.10.8"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]
